# Uncomment to enable the Nice!View display
# CONFIG_ZMK_DISPLAY=y

# Uncomment to enable eager debouncing
# CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=1
# CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5

# Uncomment to enable deep sleep (saves battery)
# CONFIG_ZMK_SLEEP=y
# CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# Uncomment to increase Bluetooth transmit power
# CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Rotary encoder (EC11).
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# Per-key SK6812-mini-e RGB underglow chain — 28 LEDs/side on D0.
# CONFIG_WS2812_STRIP is required on Zephyr 3.5 (what ZMK 0.3 ships with) as
# the parent menuconfig that gates the inner choice of WS2812 backend.
# CONFIG_LED_STRIP and CONFIG_SPI are selected via dependencies but pinned
# explicitly to avoid silent regressions.
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_LED_STRIP=y
CONFIG_WS2812_STRIP=y
CONFIG_SPI=y

# Encoder phase A (P10 = P0.09) is one of the nRF52840's NFC pins.
# Reclaim it as GPIO so encoder rotation reads.
CONFIG_NFCT_PINS_AS_GPIOS=y

# ZMK's underglow defaults EXT_POWER coupling to ON. With it on,
# zmk_rgb_underglow_init() bails with -ENODEV before touching the strip
# if the EXT_POWER device ever reports not-ready. We don't gate LED power
# through it, so decouple.
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=n

# Save brightness/colour changes to NVS 1 s after the last change. Default
# is 60 s which races against power-cycle for testing; 1 s is fast enough
# to capture user intent without thrashing flash on rapid encoder twists.
CONFIG_ZMK_SETTINGS_SAVE_DEBOUNCE=1000

# Boot-time defaults intentionally NOT overridden — let ZMK's defaults
# apply (HUE=0/red, SAT=100, BRT=100, ON=true, EFF=solid, SPD=3).
# These only matter when NVS is empty (first boot or after settings_reset).
# Any user-triggered save_state (encoder twist, push, etc.) writes the
# current state to NVS, and on every subsequent boot settings_load()
# replaces these defaults with the saved value before the LEDs see it.

# Bigger log ring buffer. ZMK_LOG_LEVEL defaults to 4 (DBG) under the
# zmk-usb-logging snippet, which emits hundreds of split_central BLE
# scan lines per second and overflowed the snippet's 8K default ring,
# silently dropping [VPS] lines mid-trace. ZMK_LOG_LEVEL itself isn't
# user-settable (no prompt; computed from a choice template that
# ZMK's app/Kconfig overrides with an unconditional `default 4`), so
# we widen the buffer instead — 32K is ~10 s of BT-scan noise at the
# observed rate, plenty of headroom for [VPS] LOG_INF to land.
CONFIG_LOG_BUFFER_SIZE=32768
