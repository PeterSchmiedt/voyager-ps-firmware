# See https://zmk.dev/docs/development/hardware-integration/hardware-metadata-files
# for instructions.

file_format: "1"
id: voyager_ps
name: voyager-ps
type: shield

url: https://github.com/PeterSchmiedt/voyager-ps-firmware

# See https://zmk.dev/docs/development/hardware-integration/hardware-metadata-files#features
#
# No "studio": ZMK Studio is deliberately not supported. CONFIG_ZMK_STUDIO
# selects ZMK_KEYMAP_SETTINGS_STORAGE, which moves the keymap out of flash into
# an NVS-backed copy — the devicetree keymap here stops being authoritative, and
# recovering from a bad Studio write means flashing settings_reset, losing the
# BLE profiles and saved RGB state with it. The keymap is version-controlled
# with a five-minute CI turnaround, so live editing is not worth that.
features:
  - keys
  - encoder
  - underglow

requires:
  - pro_micro

siblings:
  - voyager_ps_left
  - voyager_ps_right
