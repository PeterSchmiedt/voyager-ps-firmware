# Uncomment to enable the Nice!View display
# CONFIG_ZMK_DISPLAY=y

# Uncomment to enable eager debouncing
# CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=1
# CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5

# Uncomment to enable deep sleep (saves battery)
# CONFIG_ZMK_SLEEP=y
# CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# Uncomment to increase Bluetooth transmit power
# CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Rotary encoder (EC11) — present on both halves
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# Per-key SK6812-mini-e RGB underglow chain (28 LEDs/side, data on P16)
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_WS2812_STRIP=y
CONFIG_LED_STRIP=y
CONFIG_SPI=y

# LED data (P16 = P0.10) and encoder phase A (P10 = P0.09) sit on the
# nRF52840's NFC pins. Reclaim them as GPIO or the strip and the knob
# silently refuse to do anything.
CONFIG_NFCT_PINS_AS_GPIOS=y

# EXT_POWER coupling defaults to ON in ZMK's underglow Kconfig. With it on,
# zmk_rgb_underglow_init() does `if (!device_is_ready(ext_power)) return
# -ENODEV;` BEFORE ever poking the strip — and if the nice_nano_v2's
# EXT_POWER node ever reports not-ready, the strip is silently dead. We
# don't gate LED power through it, so just disable the coupling.
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=n

# Boot state: solid green, 30 % brightness — unmistakably visible and
# under ~300 mA total across the chain (well within USB-A current budget).
# 28 SK6812-mini-e at full white draws ~1.7 A; keep brightness modest.
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=y
CONFIG_ZMK_RGB_UNDERGLOW_HUE_START=120
CONFIG_ZMK_RGB_UNDERGLOW_SAT_START=100
CONFIG_ZMK_RGB_UNDERGLOW_BRT_START=30
CONFIG_ZMK_RGB_UNDERGLOW_BRT_STEP=10
