# Uncomment to enable the Nice!View display
# CONFIG_ZMK_DISPLAY=y

# Uncomment to enable eager debouncing
# CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=1
# CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5

# Uncomment to enable deep sleep (saves battery)
# CONFIG_ZMK_SLEEP=y
# CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# Uncomment to increase Bluetooth transmit power
# CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Stay on the 1M PHY: some Windows BLE adapters negotiate 2M and then
# fail to pair or drop the connection shortly after.
CONFIG_BT_CTLR_PHY_2M=n

# Rotary encoder (EC11).
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# Per-key SK6812-mini-e RGB underglow chain — 28 LEDs/side on D0. The
# WS2812 driver is selected per-backend on Zephyr 4.x; we use the SPI
# backend (worldsemi,ws2812-spi devicetree compat). LED_STRIP and SPI
# are pulled in via dependencies but pinned explicitly to avoid silent
# regressions.
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_LED_STRIP=y
CONFIG_WS2812_STRIP_SPI=y
CONFIG_SPI=y

# Encoder phase A (P10 = P0.09) is one of the nRF52840's NFC pins.
# Reclaim it as GPIO so encoder rotation reads.
CONFIG_NFCT_PINS_AS_GPIOS=y

# ZMK's underglow defaults EXT_POWER coupling to ON. With it on,
# zmk_rgb_underglow_init() bails with -ENODEV before touching the strip
# if the EXT_POWER device ever reports not-ready. We don't gate LED power
# through it, so decouple.
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=n

# Save brightness/colour changes to NVS 1 s after the last change instead of
# the stock 60 s. Load-bearing for lighting persistence: the save only happens
# after this debounce elapses, so at the default a power-cycle within a minute
# of a knob twist silently loses the setting. 1 s captures intent without
# thrashing flash on rapid twists (each twist reschedules the same work item).
# Pairs with the set_hsb patch in firmware/zephyr/CMakeLists.txt — without that
# patch, brightness and hue never reach this save path at all.
CONFIG_ZMK_SETTINGS_SAVE_DEBOUNCE=1000
