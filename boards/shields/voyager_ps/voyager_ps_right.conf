# Uncomment to enable the Nice!View display
# CONFIG_ZMK_DISPLAY=y

# Uncomment to enable eager debouncing
# CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=1
# CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5

# Uncomment to enable deep sleep (saves battery)
# CONFIG_ZMK_SLEEP=y
# CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# Uncomment to increase Bluetooth transmit power
# CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Rotary encoder (EC11).
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# Per-key SK6812-mini-e RGB underglow chain — 28 LEDs/side on D0.
# CONFIG_WS2812_STRIP is required on Zephyr 3.5 (what ZMK 0.3 ships with) as
# the parent menuconfig that gates the inner choice of WS2812 backend.
# CONFIG_LED_STRIP and CONFIG_SPI are selected via dependencies but pinned
# explicitly to avoid silent regressions.
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_LED_STRIP=y
CONFIG_WS2812_STRIP=y
CONFIG_SPI=y

# Encoder phase A (P10 = P0.09) is one of the nRF52840's NFC pins.
# Reclaim it as GPIO so encoder rotation reads.
CONFIG_NFCT_PINS_AS_GPIOS=y

# ZMK's underglow defaults EXT_POWER coupling to ON. With it on,
# zmk_rgb_underglow_init() bails with -ENODEV before touching the strip
# if the EXT_POWER device ever reports not-ready. We don't gate LED power
# through it, so decouple.
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=n

# Boot state: solid green, 10 % brightness. 28 SK6812-mini-e at full white
# pulls ~1.7 A which exceeds USB-A budget; 10 % is unmistakably visible
# while keeping the chain well under 100 mA.
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=y
CONFIG_ZMK_RGB_UNDERGLOW_HUE_START=120
CONFIG_ZMK_RGB_UNDERGLOW_SAT_START=100
CONFIG_ZMK_RGB_UNDERGLOW_BRT_START=10
CONFIG_ZMK_RGB_UNDERGLOW_BRT_STEP=10

# Shorten the NVS save debounce so brightness/colour changes via set_hsb
# get persisted within a couple of seconds instead of the default 60 s.
# Useful while we're testing the strip; bump back up for normal use.
CONFIG_ZMK_SETTINGS_SAVE_DEBOUNCE=2000
